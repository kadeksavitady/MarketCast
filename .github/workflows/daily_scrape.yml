name: Daily Siskaperbapo Scraper

on:
  schedule:
    - cron: '0 5 * * *' # 12:00 WIB setiap hari
  workflow_dispatch:

jobs:
  scrape_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip             # mempercepat instalasi dependencies dengan caching pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run Daily Scraper (with retry)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/data/daily_scraper.py
        # Retry 3x dengan jeda 5 menit jika gagal
        run: |
          for i in 1 2 3; do
            python src/data/daily_scraper.py && break
            echo "Attempt $i failed. Retrying in 5 minutes..."
            sleep 300
          done